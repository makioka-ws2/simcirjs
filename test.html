<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <script type="text/javascript" src="simcir.js"></script>
    <link rel="stylesheet" type="text/css" href="simcir.css" />
    <script type="text/javascript" src="simcir-basicset.js"></script>
    <link rel="stylesheet" type="text/css" href="simcir-basicset.css" />
    <script type="text/javascript" src="simcir-library.js"></script>
    <script>
      $(function() {
    simcir.registerDevice('DCToggle', function(device) {
      // 1. 部品サイズと出力端子の位置（右端中央 x=16, y=0）
      device.halfWidth = 16;
      device.halfHeight = 16;
      var out = device.addOutput(16, 0); // 出力端子を右側に作成
      var state = false;                // 初期状態 (OFF)

      var update = function() {
        // DC出力（ONなら 1、OFFなら 通電なし/null）
        out.setValue(state ? 1 : null);

        var $surface = device.getSurface();
        $surface.children().remove();

        // ① 外枠（スイッチ台座）
        $surface.append(simcir.createSvgElement('rect')
          .attr('x', -14).attr('y', -14).attr('width', 28).attr('height', 28)
          .attr('rx', 4).css('fill', '#f4f4f4').css('stroke', '#333').css('stroke-width', '1'));

        // ② スイッチの溝（ONで緑、OFFでグレー）
        $surface.append(simcir.createSvgElement('rect')
          .attr('x', -5).attr('y', -10).attr('width', 10).attr('height', 20)
          .attr('rx', 5).css('fill', state ? '#4CAF50' : '#b0b0b0'));

        // ③ つまみ（円形ノブ：ONで上、OFFで下に移動）
        $surface.append(simcir.createSvgElement('circle')
          .attr('cx', 0).attr('cy', state ? -5 : 5).attr('r', 4.5)
          .css('fill', '#ffffff').css('stroke', '#333').css('stroke-width', '1'));

        // ④ 「DC」の刻印テキスト
        $surface.append(simcir.createSvgElement('text')
          .attr('x', -9).attr('y', -2).attr('text-anchor', 'middle')
          .css('font-size', '6px').css('font-weight', 'bold').css('fill', '#555')
          .text('D'));
        $surface.append(simcir.createSvgElement('text')
          .attr('x', -9).attr('y', 5).attr('text-anchor', 'middle')
          .css('font-size', '6px').css('font-weight', 'bold').css('fill', '#555')
          .text('C'));
      };

      // クリックで切り替え
      device.$ui.on('click', function() {
        state = !state;
        update();
      });

      update();
    });
  });
  </script>
  <title>SimcirJS Sandbox</title>
  </head>
  <body>
    <div class="simcir">
    {
      "width":1200,
      "height":600,
      "showToolbox":true,
      "toolbox":[
        {"type":"DC"},
        {"type":"Toggle","label":"Switch"},
        {"type":"LED","label":"OUTPUT"},
        {"type":"AND"},
        {"type":"OR"},
        {"type":"NOT"},
        {"type":"NAND"},
        {"type":"NOR"},
        {"type":"XOR"},
        {"type":"DCToggle"}
      ]
    }
    </div>
  </body>
</html>
