<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <script type="text/javascript" src="simcir.js"></script>
    <link rel="stylesheet" type="text/css" href="simcir.css" />
    <script type="text/javascript" src="simcir-basicset.js"></script>
    <link rel="stylesheet" type="text/css" href="simcir-basicset.css" />
    <script type="text/javascript" src="simcir-library.js"></script>
    <script>
      simcir.registerDevice('DC-Toggle', function(device) {
        var out = device.addOutput(); // 出力ノード作成
        var state = false;            // 初期状態 OFF
        device.halfWidth = 22;
        device.halfHeight = 14;
        var update = function() {
          out.setValue(state ? 1 : null); // ONなら1、OFFなら通電なし
          var $surface = device.getSurface();
          $surface.children().remove();
          // ボタンの外枠（ONで緑、OFFでグレー）
          $surface.append(simcir.createSvgElement('rect')
            .attr('x', -20).attr('y', -12).attr('width', 40).attr('height', 24)
            .attr('rx', 4).css('fill', state ? '#4CAF50' : '#CCCCCC').css('stroke', '#000'));
          // ラベル文字
        $surface.append(simcir.createSvgElement('text')
          .attr('x', 0).attr('y', 4).attr('text-anchor', 'middle')
          .css('font-size', '10px').css('font-weight', 'bold').css('fill', state ? '#FFF' : '#000')
          .text(state ? 'DC ON' : 'DC OFF'));
      };
      // クリックで切り替え
      device.$ui.on('click', function() {
        state = !state;
        update();
      });
      update();
    });
  </script>
  <title>SimcirJS Sandbox</title>
  </head>
  <body>
    <div class="simcir">
    {
      "width":1200,
      "height":600,
      "showToolbox":true,
      "toolbox":[
        {"type":"DC"},
        {"type":"Toggle","label":"Switch"},
        {"type":"LED","label":"OUTPUT"},
        {"type":"AND"},
        {"type":"OR"},
        {"type":"NOT"},
        {"type":"NAND"},
        {"type":"NOR"},
        {"type":"XOR"}
      ]
    }
    </div>
  </body>
</html>
