<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <script type="text/javascript" src="simcir.js"></script>
    <link rel="stylesheet" type="text/css" href="simcir.css" />
    <script type="text/javascript" src="simcir-basicset.js"></script>
    <link rel="stylesheet" type="text/css" href="simcir-basicset.css" />
    <script type="text/javascript" src="simcir-library.js"></script>
    <script>
      simcir.registerDevice('DCToggle', function(device) {
        device.halfWidth = 16;
        device.halfHeight = 16;

        // 右端中央 (x:16, y:0) に出力ポートを追加
        var out = device.addOutput(16, 0);
        var state = false;

        var updateUI = function() {
          out.setValue(state ? 1 : null);

          var $surface = device.getSurface();
          $surface.children().remove();

          // 外枠（スイッチ台座）
          $surface.append(simcir.createSvgElement('rect')
            .attr('x', -12).attr('y', -12).attr('width', 24).attr('height', 24)
            .attr('rx', 3).css('fill', '#e0e0e0').css('stroke', '#000'));

          // スイッチ溝（ONで緑、OFFでグレー）
          $surface.append(simcir.createSvgElement('rect')
            .attr('x', -5).attr('y', -9).attr('width', 10).attr('height', 18)
            .attr('rx', 4).css('fill', state ? '#4CAF50' : '#888888'));

          // スイッチつまみ（ONで上、OFFで下）
          $surface.append(simcir.createSvgElement('circle')
            .attr('cx', 0).attr('cy', state ? -4 : 4).attr('r', 4)
            .css('fill', '#ffffff').css('stroke', '#000'));
        };

        device.$ui.on('click', function() {
          state = !state;
          updateUI();
        });

        updateUI();
      });
    </script>
  <title>SimcirJS Sandbox</title>
<!-- 1. iPadでの画面移動・ズームを防止 -->
<style>
  .simcir, .simcir * {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
</style>

<!-- 2. タッチイベント（touchstart/move/end）をマウスイベントに変換 -->
<script>
  (function() {
    function touchHandler(event) {
      var touches = event.changedTouches,
          first = touches[0],
          type = "";

      switch(event.type) {
        case "touchstart": type = "mousedown"; break;
        case "touchmove":  type = "mousemove"; break;        
        case "touchend":   type = "mouseup";   break;
        default: return;
      }

      var simulatedEvent = document.createEvent("MouseEvent");
      simulatedEvent.initMouseEvent(
        type, true, true, window, 1,
        first.screenX, first.screenY,
        first.clientX, first.clientY, false,
        false, false, false, 0, null
      );

      first.target.dispatchEvent(simulatedEvent);
      
      if (event.cancelable) {
        event.preventDefault();
      }
    }

    window.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.simcir').forEach(function(el) {
        el.addEventListener("touchstart", touchHandler, true);
        el.addEventListener("touchmove", touchHandler, true);
        el.addEventListener("touchend", touchHandler, true);
        el.addEventListener("touchcancel", touchHandler, true);
      });
    });
  })();
</script>
  </head>
  <body>
    <div class="simcir">
    {
      "width":1200,
      "height":600,
      "showToolbox":true,
      "toolbox":[
        {"type":"DC"},
        {"type":"Toggle","label":"Switch"},
        {"type":"LED","label":"OUTPUT"},
        {"type":"AND"},
        {"type":"OR"},
        {"type":"NOT"},
        {"type":"NAND"},
        {"type":"NOR"},
        {"type":"XOR"},
        {"type":"DCToggle"}
      ]
    }
    </div>
  </body>
</html>
